[project]
name = "it-ticket-agents"
version = "0.1.0"
description = "Multi-agent IT support ticket triage and remediation system (LangGraph, MCP, hosted LLM/embeddings)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
it-ticket-agents = "it_ticket_agents:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"